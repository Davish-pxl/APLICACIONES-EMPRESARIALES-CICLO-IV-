<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Utilería y Papelería{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'utileria:producto_list' %}">Utilería y Papelería</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'utileria:producto_list' %}">Catálogo</a>
                <a class="nav-link" href="{% url 'utileria:producto_create' %}">Nuevo Producto</a>
                <a class="nav-link" href="{% url 'utileria:pedido_list' %}">Ver Pedidos</a>
                <a class="nav-link" href="{% url 'utileria:reporte' %}">Reportes</a>
            </div>
        </div>
    </nav>

    <main class="container flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <small>2026 Utilería y Papelería — Desarrollo de Aplicaciones Empresariales</small>
    </footer>

</body>
</html>
