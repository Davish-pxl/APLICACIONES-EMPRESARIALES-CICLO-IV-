{% extends 'utileria/base.html' %}

{% block title %}Agregar Producto al Pedido - Utilería{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Agregar Producto al Pedido #{{ pedido.id }}</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="producto" class="form-label fw-bold">Seleccionar Producto:</label>
                        <select name="producto" id="producto" class="form-select" required>
                            <option value="" selected disabled>-- Seleccione un producto --</option>
                            {% for producto in productos %}
                                <option value="{{ producto.id }}">{{ producto.nombre }} - S/ {{ producto.precio }} (Stock: {{ producto.stock }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="cantidad" class="form-label fw-bold">Cantidad:</label>
                        <input type="number" name="cantidad" id="cantidad" class="form-control" min="1" value="1" required>
                    </div>

                    <div class="mb-3">
                        <label for="precio_unitario" class="form-label fw-bold">Precio Unitario (S/):</label>
                        <input type="number" step="0.01" name="precio_unitario" id="precio_unitario" class="form-control" placeholder="0.00" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'utileria:pedido_list' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Ítem</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
