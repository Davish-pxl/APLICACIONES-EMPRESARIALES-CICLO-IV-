{% extends 'core/base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <h2 class="mb-4">Nueva Reserva</h2>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">Cancha</label>
            <input type="text" name="cancha" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Deporte</label>
            <input type="text" name="deporte" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha (AAAA-MM-DD)</label>
            <input type="date" name="fecha" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Hora (HH:MM)</label>
            <input type="time" name="hora" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Duración (Horas)</label>
            <input type="number" step="0.5" name="duracion_horas" value="1.0" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio por Hora</label>
            <input type="number" step="0.1" name="precio_hora" value="20.0" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <input type="text" name="cliente" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success">Guardar Reserva</button>
        <a href="{% url 'reservas:lista' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
