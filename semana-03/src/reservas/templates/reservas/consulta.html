{% extends 'core/base.html' %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <h2>Dejar una Consulta</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success mt-2">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post" class="card p-4 shadow-sm bg-white mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-info text-white">Enviar Consulta</button>
            <a href="{% url 'reservas:lista' %}" class="btn btn-secondary">Volver al Listado</a>
        </div>
    </form>
</div>
{% endblock %}
