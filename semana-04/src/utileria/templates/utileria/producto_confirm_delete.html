{% extends 'core/base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <div class="card p-4 shadow-sm border-danger bg-white">
        <h3 class="text-danger">Confirmar Eliminación</h3>
        <p>¿Estás seguro de que deseas eliminar el producto <strong>{{ producto.nombre }}</strong> (Código: {{ producto.codigo }})?</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                <a href="{% url 'utileria:producto_list' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
