<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión | Utilería & Reservas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .navbar-custom {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        .nav-link {
            transition: all 0.2s ease-in-out;
            font-weight: 500;
        }
        .nav-link:hover {
            color: #38bdf8 !important;
            transform: translateY(-1px);
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navegación Superior Profesional -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{% url 'utileria:producto_list' %}">
                <i class="bi bi-box-seam-fill text-info fs-4"></i>
                <span>Utilería & Papelería</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'utileria:producto_list' %}">
                            <i class="bi bi-grid-3x3-gap-fill me-1"></i> Productos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'utileria:pedido_list' %}">
                            <i class="bi bi-receipt me-1"></i> Pedidos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'utileria:registrar_pedido_transaccion' %}">
                            <i class="bi bi-lightning-charge-fill me-1 text-warning"></i> Transacción
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'utileria:reporte' %}">
                            <i class="bi bi-bar-chart-line-fill me-1 text-info"></i> Reporte
                        </a>
                    </li>
                    <li class="nav-item border-start ps-2 ms-2">
                        <a class="nav-link px-3 text-success fw-bold" href="{% url 'reservas:lista' %}">
                            <i class="bi bi-calendar-check-fill me-1"></i> Reservas
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-2 flex-grow-1">
        <!-- Despliegue de alertas dinámicas -->
        {% if messages %}
            <div class="row">
                <div class="col-12">
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm" role="alert">
                            <i class="bi {% if message.tags == 'error' %}bi-exclamation-triangle-fill{% else %}bi-check-circle-fill{% endif %} me-2"></i>
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer Elegante -->
    <footer class="bg-white text-center text-muted py-3 border-top mt-5">
        <div class="container small">
            <span>Sistema de Gestión Avanzado &copy; Laboratorio 07 — ORM Avanzado y Transacciones</span>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.bundle.min.css"></script>
</body>
</html>
