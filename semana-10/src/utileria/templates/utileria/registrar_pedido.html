{% extends 'utileria/base.html' %}

{% block title %}Transacción de Pedido — Utilería{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-8 col-lg-6">
        <div class="card card-item shadow-sm border-0 rounded-3 overflow-hidden">
            <!-- Encabezado con icono de transacción -->
            <div class="card-header bg-dark text-white p-3 d-flex align-items-center gap-2">
                <i class="fas fa-bolt text-warning fs-5"></i>
                <div>
                    <h5 class="m-0 fw-bold">Registrar Nuevo Pedido (Transaccional)</h5>
                    <small class="text-secondary">Operación con descuento</small>
                </div>
            </div>

            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}

                    <!-- Selección de Producto -->
                    <div class="mb-3">
                        <label for="producto_id" class="form-label fw-bold text-dark">
                            <i class="fas fa-box text-secondary me-1"></i> Seleccionar Producto:
                        </label>
                        <select name="producto_id" id="producto_id" class="form-select form-select-lg fs-6" required>
                            <option value="">-- Seleccione un producto --</option>
                            {% for producto in productos %}
                                <option value="{{ producto.id }}">
                                    {{ producto.nombre }} — Stock disponible: {{ producto.stock }} unid. (S/ {{ producto.precio|floatformat:2 }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Cantidad a Solicitar -->
                    <div class="mb-4">
                        <label for="cantidad" class="form-label fw-bold text-dark">
                            <i class="fas fa-cubes text-secondary me-1"></i> Cantidad a solicitar:
                        </label>
                        <input 
                            type="number" 
                            name="cantidad" 
                            id="cantidad" 
                            class="form-control form-control-lg fs-6" 
                            value="1" 
                            min="1" 
                            required
                        >
                    </div>

                    <!-- Botones de Acción -->
                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a href="{% url 'utileria:pedido_list' %}" class="btn btn-outline-secondary px-4">
                            <i class="fas fa-arrow-left me-1"></i> Volver a Pedidos
                        </a>
                        <button type="submit" class="btn btn-warning text-dark fw-bold px-4 shadow-sm">
                            <i class="fas fa-check-circle me-1"></i> Registrar Pedido
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
