{% extends 'utileria/base.html' %}

{% block title %}Formulario de Producto{% endblock %}

{% block content %}
<div class="card shadow-sm col-md-6 mx-auto">
    <div class="card-header bg-dark text-white">
        <h4 class="mb-0">Registrar / Editar Producto</h4>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label fw-bold">Código del Producto</label>
                <input type="text" name="codigo" class="form-control" value="{{ producto.codigo|default:'' }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Nombre del Útil</label>
                <input type="text" name="nombre" class="form-control" value="{{ producto.nombre|default:'' }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Precio Unitario (S/)</label>
                <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio|default:'' }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Stock en Almacén</label>
                <input type="number" name="stock" class="form-control" value="{{ producto.stock|default:'0' }}" required>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'utileria:producto_list' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success">Guardar Cambios</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
