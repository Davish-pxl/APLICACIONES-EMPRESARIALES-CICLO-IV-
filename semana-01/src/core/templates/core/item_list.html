<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Items</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light container py-4">
    <h2>Items Registrados <span class="badge bg-primary">{{ total_items }}</span></h2>
    <div class="row mt-3">
        {% for item in items %}
            <div class="col-md-4 mb-3">
                <div class="card p-3">
                    <h5>{{ item.name }}</h5>
                    <p class="text-muted">{{ item.description|default:"Sin descripción" }}</p>
                </div>
            </div>
        {% empty %}
            <div class="alert alert-info">No hay items registrados actualmente.</div>
        {% endfor %}
    </div>
</body>
</html>
