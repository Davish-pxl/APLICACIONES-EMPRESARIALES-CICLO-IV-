{% extends 'core/base.html' %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <h2>Registrar Nueva Reserva</h2>
    
    <form method="post" class="card p-4 shadow-sm bg-white mt-3">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="alert alert-danger">
                {% for error in form.non_field_errors %}
                    <p class="mb-0">{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

        {{ form.as_p }}

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-success">Guardar Reserva</button>
            <a href="{% url 'reservas:lista' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
